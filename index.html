        <div id="particles"></div>

            <div id="landing-card">

                <img src="assets/marvel-logo.jpg" alt="Marvel">

                <h1 class="landing-title">MCU Archive</h1>

                <p class="landing-tagline">
                    Every film and series in the Marvel Cinematic Universe,
                    mapped as one branching universe.
                </p>

                <!-- Filled in from data/mcu.json by app.js, so it stays
                     right as titles are added. Hidden until then. -->
                <div id="landing-stats" aria-live="polite"></div>

                <button id="enterButton">
                    Enter the Archive <span class="enter-arrow" aria-hidden="true">&rarr;</span>
                </button>

                <div class="landing-hint">or press <kbd>Enter</kbd></div>

            </div>

            <!-- Shown at the start: invites the scroll. -->
            <div class="intro-scroll-hint" aria-hidden="true">
                <span>Scroll to fly through the MCU</span>
                <span class="intro-scroll-chevron">&#8964;</span>
            </div>

            <!-- Shown once the fly-through has started. -->
            <button id="intro-skip" type="button">Skip to the archive &rarr;</button>

            <!-- Shown at the end of the fly-through. -->
            <div id="intro-end">
                <div class="intro-end-kicker">That's the MCU so far</div>
                <div class="intro-end-title">Now explore how it all connects</div>
                <button id="intro-end-enter" type="button">
                    Enter the Archive <span class="enter-arrow" aria-hidden="true">&rarr;</span>
                </button>
            </div>

        </div>

        <div class="intro-spacer" aria-hidden="true"></div>

    </section>

        <!-- Universe -->

        <canvas id="universe"></canvas>

        <!-- World -->

        <main id="viewport">

            <div id="world"></div>

        </main>
